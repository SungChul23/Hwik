<rect x="335" y="710" width="180" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-size="12" x="425" y="728" text-anchor="middle" dominant-baseline="central" fill="#085041">생성 문장 S3 저장</text>
